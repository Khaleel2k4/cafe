<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SereniTea Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        #admin-login-container,
        #admin-dashboard {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .order-table th,
        .order-table td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .order-table th {
            background-color: #4CAF50;
            color: white;
        }

        .order-table td button {
            padding: 5px 10px;
            margin-left: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        .order-table td button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="admin-login-container">
        <h2>Admin Login</h2>
        <form id="adminLoginForm">
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" class="error" style="display:none;">Invalid email or password!</div>
    </div>

    <div id="admin-dashboard" style="display: none;">
        <h2>Welcome to the Admin Dashboard</h2>
        <h3>Orders List</h3>
        <table class="order-table" id="orderTable">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Item(s)</th>
                    <th>Price</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Orders will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        // Admin login and orders display logic

        // Admin login form submission
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminLoginForm');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;

                // Check credentials
                if (email === 'admin@serenitea.com' && password === 'admin123') {
                    // Show the admin dashboard
                    document.getElementById('admin-login-container').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'block';
                    alert('Login successful!');
                    displayAllOrders(); // Show the orders after login
                } else {
                    document.getElementById('errorMessage').style.display = 'block'; // Show error message
                }
            });
        });

        // Function to display all orders from localStorage
        function displayAllOrders() {
            const orderTable = document.getElementById('orderTable').getElementsByTagName('tbody')[0];
            const orders = JSON.parse(localStorage.getItem('orders')) || [];

            // Clear existing rows
            orderTable.innerHTML = '';

            // Loop through orders and add them to the table
            orders.forEach(order => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.customerName}</td>
                    <td>${order.items.map(item => item.name).join(', ')}</td>
                    <td>₹${order.total}</td>
                    <td>${new Date(order.date).toLocaleString()}</td>
                    <td>
                        ${order.status}
                        <button onclick="updateOrderStatus('${order.id}', 'Accepted')">Accept</button>
                        <button onclick="updateOrderStatus('${order.id}', 'Rejected')">Reject</button>
                    </td>
                `;
                orderTable.appendChild(row);
            });
        }

        // Function to update order status (Accept/Reject)
        function updateOrderStatus(orderId, newStatus) {
            // Fetch orders from localStorage
            let orders = JSON.parse(localStorage.getItem('orders')) || [];

            // Find the order by ID and update its status
            const orderIndex = orders.findIndex(order => order.id === orderId);
            if (orderIndex !== -1) {
                orders[orderIndex].status = newStatus;

                // Save updated orders back to localStorage
                localStorage.setItem('orders', JSON.stringify(orders));

                // Refresh the orders table
                displayAllOrders();
            }
        }
    </script>

</body>
</html>

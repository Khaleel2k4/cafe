<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us – SereniTea Cafe</title>
  <link rel="stylesheet" href="cafe.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="contact-wrapper">
    <div class="contact-header">
      <h1>Contact SereniTea Cafe</h1>
      <p>Have questions, suggestions, or just want to say hello? We’re here for you!</p>
    </div>

    <div class="contact-container">
      <div class="contact-info">
        <h2>Get In Touch</h2>
        <p><i class="fas fa-map-marker-alt"></i>123 Brew Street, Hyderabad, India</p>
        <p><i class="fas fa-phone-alt"></i>+91 98765 43210</p>
        <p><i class="fas fa-envelope"></i>hello@sereniteacafe.com</p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
      </div>

      <div class="contact-form">
        <h2>Send a Message</h2>
        <form action="#" method="post">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <div class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.123456789!2d78.486671315342!3d17.385044088049!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb1234567890!2sSereniTea%20Cafe!5e0!3m2!1sen!2sin!4v1610000000000!5m2!1sen!2sin" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

</body>
</html>
